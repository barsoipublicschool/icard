<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superfast Scanner - Barsoi Public School</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body { font-family: Arial, sans-serif; background: #eef7f2; text-align: center; padding: 20px; }
    #reader { max-width: 420px; margin: 15px auto; border: 3px solid #198754; border-radius: 12px; background: #fff; }
    .status-text { font-size: 18px; font-weight: bold; color: #0f5132; }
</style>
</head>
<body>

<h2 style="color:#0f5132;">Barsoi Public School</h2>
<p class="status-text">QR Scanner (Auto Class Attendance)</p>

<div id="reader"></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz4ST4RCzKbLGUMsXCH8_JHljLfe30vGEk_L7aqjRWfH6MyJ5UD0ilXYj4lwWANiQQKWQ/exec";

    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
        try {
            let data = JSON.parse(decodedText);
            html5QrcodeScanner.clear().then(() => {
                markAttendance(data);
            });
        } catch (e) {
            Swal.fire('Error', 'Invalid QR Code', 'error').then(() => restartScanner());
        }
    }

    function markAttendance(studentData) {
        Swal.fire({
            title: 'Marking Present...',
            text: `${studentData.name} (${studentData.class})`,
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        fetch(`${API_URL}?action=markAttendance&data=${encodeURIComponent(JSON.stringify(studentData))}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "Success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'Present Marked!',
                        text: `${res.name} - Class ${studentData.class}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => restartScanner());
                } else if (res.status === "Already Marked") {
                    Swal.fire({
                        icon: 'info',
                        title: 'Already Marked',
                        text: `${res.name} ki attendance aaj ho chuki hai.`,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => restartScanner());
                } else {
                    Swal.fire('Error', res.message || 'Failed', 'error').then(() => restartScanner());
                }
            })
            .catch(() => {
                Swal.fire('Error', 'Server connection failed', 'error').then(() => restartScanner());
            });
    }

    function restartScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    }

    document.addEventListener("DOMContentLoaded", restartScanner);
</script>
</body>
</html>
