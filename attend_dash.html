<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard - Barsoi Public School</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .container {
        max-width: 1000px;
        margin: 0 auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
        color: #0f5132;
        text-align: center;
        margin-top: 0;
    }
    .filter-section {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        background: #eef7f2;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #198754;
    }
    .filter-box {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
    }
    .filter-box label {
        font-size: 12px;
        font-weight: bold;
        color: #0f5132;
        margin-bottom: 5px;
    }
    .filter-box select, .filter-box input {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        font-size: 14px;
    }
    .stats-card {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }
    .stat-box {
        flex: 1;
        background: #198754;
        color: white;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
    }
    .stat-box h3 { margin: 0; font-size: 24px; }
    .stat-box p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
    th, td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
        font-size: 13.5px;
    }
    th {
        background-color: #0f5132;
        color: white;
    }
    tr:hover { background-color: #f9f9f9; }
    .badge {
        background: #d1e7dd;
        color: #0f5132;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 11px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Barsoi Public School - Attendance Dashboard</h2>

    <!-- Stats Overview -->
    <div class="stats-card">
        <div class="stat-box">
            <h3 id="totalRecords">0</h3>
            <p>Total Attendance Records</p>
        </div>
        <div class="stat-box" style="background: #0f5132;">
            <h3 id="filteredCount">0</h3>
            <p>Filtered Results</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="filter-section">
        <div class="filter-box">
            <label>Filter by Class:</label>
            <select id="classFilter" onchange="filterData()">
                <option value="">All Classes</option>
            </select>
        </div>
        <div class="filter-box">
            <label>Search Student (Name or ID):</label>
            <input type="text" id="searchFilter" placeholder="Type name or roll..." onkeyup="filterData()">
        </div>
        <div class="filter-box">
            <label>Filter by Date:</label>
            <input type="date" id="dateFilter" onchange="filterData()">
        </div>
    </div>

    <!-- Data Table -->
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Student ID</th>
                    <th>Roll No</th>
                    <th>Class</th>
                    <th>Student Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align: center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwor-L5vsAo82PQ8t14ztsVbNZ6SjMizTxvQKpPJPBeUknK7nRE4wrC37A9McdUFDYG/exec"; // Apna Google Web App URL yahan paste karein
    let allAttendanceData = [];

    window.addEventListener('DOMContentLoaded', () => {
        fetchDashboardData();
    });

    function fetchDashboardData() {
        fetch(`${API_URL}?action=getAttendanceData`)
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data)) {
                    allAttendanceData = data;
                    populateClassDropdown(data);
                    renderTable(data);
                } else {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">No data found</td></tr>`;
                }
            })
            .catch(err => {
                console.error(err);
                Swal.fire('Error', 'Data load karne mein samasya aayi', 'error');
            });
    }

    function populateClassDropdown(data) {
        const classes = [...new Set(data.map(item => item.className))].filter(Boolean);
        const classSelect = document.getElementById('classFilter');
        classSelect.innerHTML = '<option value="">All Classes</option>';
        classes.forEach(cls => {
            let opt = document.createElement('option');
            opt.value = cls;
            opt.innerText = cls;
            classSelect.appendChild(opt);
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        document.getElementById('totalRecords').innerText = allAttendanceData.length;
        document.getElementById('filteredCount').innerText = data.length;

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">No records match your filter</td></tr>`;
            return;
        }

        let html = '';
        data.forEach(row => {
            html += `<tr>
                <td>${row.timestamp}</td>
                <td><b>${row.studentId}</b></td>
                <td>${row.rollNo}</td>
                <td>${row.className}</td>
                <td><b>${row.name}</b></td>
                <td><span class="badge">${row.status}</span></td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    function filterData() {
        const selectedClass = document.getElementById('classFilter').value.toLowerCase();
        const searchText = document.getElementById('searchFilter').value.toLowerCase();
        const selectedDate = document.getElementById('dateFilter').value;

        const filtered = allAttendanceData.filter(item => {
            const matchClass = selectedClass === "" || String(item.className).toLowerCase() === selectedClass;
            const matchSearch = searchText === "" || String(item.name).toLowerCase().includes(searchText) || String(item.studentId).toLowerCase().includes(searchText) || String(item.rollNo).toLowerCase().includes(searchText);
            const matchDate = selectedDate === "" || String(item.timestamp).includes(selectedDate);

            return matchClass && matchSearch && matchDate;
        });

        renderTable(filtered);
    }
</script>

</body>
</html>
